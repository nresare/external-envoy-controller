[package]
name = "external-envoy-controller"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Kubernetes control plane for external Envoy proxies"
publish = false

[dependencies]
anyhow = "1.0.103"
async-stream = "0.3.6"
envoy-types = "0.7.7"
futures = "0.3.32"
k8s-openapi = { version = "0.29.0", features = ["latest"] }
kube = { version = "5", features = ["runtime"] }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "grpc-tonic", "tls-ring", "tls-roots", "internal-logs"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "internal-logs"] }
prost = "0.14"
serde_json = "1.0.150"
tonic = "0.14"
tonic-reflection = { version = "0.14", features = ["server"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "sync", "net"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tonic-health = "0.14"

[dev-dependencies]
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic", "trace"] }
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
