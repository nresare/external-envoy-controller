apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "external-envoy-controller.fullname" . }}
  labels:
    {{- include "external-envoy-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services/status"]
    verbs: ["patch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "external-envoy-controller.fullname" . }}
  labels:
    {{- include "external-envoy-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "external-envoy-controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "external-envoy-controller.fullname" . }}
    namespace: {{ .Release.Namespace }}
