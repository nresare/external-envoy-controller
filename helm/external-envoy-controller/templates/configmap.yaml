{{- if .Values.tracing.endpoint }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "external-envoy-controller.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "external-envoy-controller.labels" . | nindent 4 }}
data:
  controller.toml: |
    [tracing]
    endpoint = {{ .Values.tracing.endpoint | toJson }}
{{- end }}
