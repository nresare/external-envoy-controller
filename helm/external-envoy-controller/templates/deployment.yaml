apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "external-envoy-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "external-envoy-controller.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "external-envoy-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if .Values.tracing.endpoint }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      {{- end }}
      labels:
        {{- include "external-envoy-controller.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "external-envoy-controller.fullname" . }}
      securityContext:
        runAsNonRoot: true
      {{- if .Values.tracing.endpoint }}
      volumes:
        - name: config
          configMap:
            name: {{ include "external-envoy-controller.fullname" . }}-config
      {{- end }}
      containers:
        - name: external-envoy-controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.tracing.endpoint }}
          args: ["--config", "/etc/external-envoy-controller/controller.toml"]
          volumeMounts:
            - name: config
              mountPath: /etc/external-envoy-controller
              readOnly: true
          {{- end }}
          ports:
            - name: xds
              containerPort: 50051
          livenessProbe:
            grpc:
              port: 50051
              service: liveness
          readinessProbe:
            grpc:
              port: 50051
              service: readiness
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
