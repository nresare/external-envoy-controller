name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy
      - name: Format check
        run: cargo fmt --check
      - name: Build
        run: cargo build --locked --verbose
      - name: Run tests
        run: cargo test --locked --verbose
      - name: Clippy check
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Lint Helm chart
        run: helm lint helm/external-envoy-controller
      - name: Render Helm chart
        run: helm template external-envoy-controller helm/external-envoy-controller
